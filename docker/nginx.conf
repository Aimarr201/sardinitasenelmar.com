
events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name ${DOMAIN};

        # Necesario para el challenge de certbot
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirigir cualquier otra petición a HTTPS
        location / {
            return 301 https://${DOMAIN}$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name ${DOMAIN};

        # Certificados gestionados por Certbot
        ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # No exponer archivos ocultos, excepto el challenge de Certbot.
        location ~ /\.(?!well-known(?:/|$)) {
            return 404;
        }

        # No servir secretos, configuraciones, copias ni credenciales.
        location ~* \.(?:env|ini|conf|config|ya?ml|log|bak|backup|old|orig|save|swp|swo|sql|sqlite|db|htpasswd|dist|example)$ {
            return 404;
        }

        # No servir código o material criptográfico como archivos estáticos.
        location ~* \.(?:php\d?|phtml|cgi|pl|py|rb|asp|aspx|jsp|sh|bash|zsh|pem|key|crt|csr|p12|pfx)$ {
            return 404;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            limit_except GET HEAD {
                deny all;
            }
            try_files $uri $uri/ =404;
            autoindex off;
        }

        location ^~ /errores/ {
            internal;
            alias /usr/share/nginx/errores/;
        }

        error_page 403 /errores/403.html;
        error_page 404 /errores/404.html;
        error_page 500 502 503 504 /errores/500.html;
    }
}
